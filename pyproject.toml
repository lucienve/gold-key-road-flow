[project]
name = "gold-key-road-flow"
version = "0.1.0"
description = "Traffic simulation model for the Gold Key neighborhood in Milford, PA, USA"
readme = "docs/project_context.md"
requires-python = ">=3.14"
dependencies = [
    "geopandas",
    "matplotlib",
    "networkx",
    "osmnx>=2.0.0",
    "requests",
    "scikit-learn",
    "scipy",
    "shapely",
]

[dependency-groups]
dev = [
    "black",
    "mypy",
    "pylint",
    "pytest",
]


[tool.mypy]
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
